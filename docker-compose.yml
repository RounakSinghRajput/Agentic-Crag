services:
  api:
    build: .
    image: agentic-crag:latest
    env_file: .env
    environment:
      # On macOS, Ollama runs on the host (Metal GPU); containers reach it here.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CHROMA_PERSIST_DIR: /app/data/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma
      - ./data/raw:/app/data/raw:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional: containerized Ollama for Linux servers (use with GPU passthrough).
  # Start with: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_data:
